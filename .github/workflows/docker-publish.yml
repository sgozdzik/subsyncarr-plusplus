name: Test, Build and Publish Docker Image

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Node lint, build and tests
        env:
          HUSKY: '0'
        run: |
          npm ci --ignore-scripts
          npm rebuild better-sqlite3
          npm run lint
          npm run build
          npm test

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: claudesynchro tests
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          pip install './claudesynchro[dev]'
          pytest claudesynchro/tests -q

  docker:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR image names must be lowercase.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/subsyncarr-plusplus" >> "$GITHUB_ENV"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 only: the bundled alass binary is x86-64, and the target NAS is Intel.
      # Build and test locally first, so a broken image never reaches the registry.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: subsyncarr-plusplus:test
          build-args: |
            APP_COMMIT=${{ github.sha }}
            APP_BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run --rm --entrypoint claudesynchro subsyncarr-plusplus:test --help
          docker run --rm --entrypoint sh subsyncarr-plusplus:test -c 'ffsubsync --version && autosubsync --help > /dev/null && alass --version && ffmpeg -version | head -1'
          # Model downloads need working HTTPS from Python (CA certificates in the image).
          docker run --rm --entrypoint claudesynchro subsyncarr-plusplus:test doctor --json > doctor.json
          python3 -c 'import json; s = json.load(open("doctor.json"))["network"]["huggingface.co"]; print("huggingface.co:", s); assert s.startswith("ok"), s'

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_COMMIT=${{ github.sha }}
            APP_BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha
