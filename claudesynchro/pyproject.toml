[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claudesynchro"
version = "0.1.0"
description = "Content-aware subtitle synchronization: matches subtitle lines by meaning against a reference (embedded/external subtitles or a Whisper transcript) and handles cuts, commercial breaks and extended editions."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "charset-normalizer>=3.0",
  # faster-whisper also brings onnxruntime, tokenizers and huggingface_hub,
  # which the local embedding model reuses.
  "faster-whisper>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
claudesynchro = "claudesynchro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
